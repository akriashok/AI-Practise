services:
  - type: web
    name: healthcare-multi-agent
    runtime: python
    plan: free
    rootDir: healthcare-multi-agent-langgraph
    buildCommand: pip install -r requirements.txt && python -m healthcare_agents.seed_data
    startCommand: python app.py
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openai/gpt-oss-120b
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
